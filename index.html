<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brAkA22</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}

body{
  font-family:'DM Sans',sans-serif;
  background:#000;
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* BACKGROUND SLIDESHOW */
.bg-slide{
  position:fixed;
  inset:0;
  z-index:0;
  background-size:cover;
  background-position:center;
  opacity:0;
  transition:opacity 1.2s ease;
}
.bg-slide.active{opacity:1;}
.bg-overlay{
  position:fixed;
  inset:0;
  z-index:1;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0.55) 0%,
    rgba(0,0,0,0.35) 40%,
    rgba(0,0,0,0.65) 100%
  );
}

/* CONTENT */
.content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2.5rem;
  padding:2rem;
  width:100%;
  max-width:480px;
}

/* LOGO */
.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:5rem;
  letter-spacing:8px;
  color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,0.5);
  line-height:1;
}
.logo span{color:#c8f03c;}
.tagline{
  font-family:'DM Mono',monospace;
  font-size:.75rem;
  letter-spacing:3px;
  color:rgba(255,255,255,0.55);
  text-transform:uppercase;
  margin-top:-.5rem;
}

/* BUTTONS */
.btns{
  display:flex;
  flex-direction:column;
  gap:.8rem;
  width:100%;
}

.btn{
  display:flex;
  align-items:center;
  gap:1rem;
  padding:1rem 1.5rem;
  border-radius:4px;
  text-decoration:none;
  transition:all .25s;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(8px);
  background:rgba(0,0,0,0.35);
  color:#fff;
  position:relative;
  overflow:hidden;
}
.btn::before{
  content:'';
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity .25s;
}
.btn:hover{
  transform:translateX(6px);
  border-color:rgba(255,255,255,0.4);
  background:rgba(0,0,0,0.5);
}
.btn:hover::before{opacity:1;}

.btn-icon{
  font-size:1.6rem;
  flex-shrink:0;
  width:36px;
  text-align:center;
}
.btn-text{flex:1;}
.btn-label{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.2rem;
  letter-spacing:2px;
  display:block;
  line-height:1.1;
}
.btn-sub{
  font-family:'DM Mono',monospace;
  font-size:.65rem;
  color:rgba(255,255,255,0.5);
  letter-spacing:1px;
  display:block;
  margin-top:.15rem;
}
.btn-arrow{
  font-size:1rem;
  color:rgba(255,255,255,0.4);
  transition:all .25s;
  flex-shrink:0;
}
.btn:hover .btn-arrow{
  color:#c8f03c;
  transform:translateX(4px);
}

/* Colori specifici per hover */
.btn-shop::before{background:rgba(200,240,60,0.08);}
.btn-shop:hover{border-color:rgba(200,240,60,0.4);}
.btn-shop:hover .btn-label{color:#c8f03c;}

.btn-goldbet::before{background:rgba(255,200,0,0.08);}
.btn-goldbet:hover{border-color:rgba(255,200,0,0.4);}
.btn-goldbet:hover .btn-label{color:#ffc800;}

.btn-bnb::before{background:rgba(255,90,60,0.08);}
.btn-bnb:hover{border-color:rgba(255,90,60,0.4);}
.btn-bnb:hover .btn-label{color:#ff5a3c;}

/* DOTS INDICATOR */
.dots{
  display:flex;
  gap:.5rem;
  position:fixed;
  bottom:2rem;
  left:50%;
  transform:translateX(-50%);
  z-index:3;
}
.dot{
  width:6px;height:6px;
  border-radius:50%;
  background:rgba(255,255,255,0.3);
  transition:all .3s;
  cursor:pointer;
}
.dot.active{
  background:#c8f03c;
  width:20px;
  border-radius:3px;
}

/* SLIDE LABEL */
.slide-label{
  position:fixed;
  bottom:3.5rem;
  left:50%;
  transform:translateX(-50%);
  z-index:3;
  font-family:'DM Mono',monospace;
  font-size:.65rem;
  color:rgba(255,255,255,0.35);
  letter-spacing:2px;
  text-transform:uppercase;
  white-space:nowrap;
  transition:opacity .5s;
}

@media(max-width:480px){
  .logo{font-size:3.8rem;}
  .content{gap:1.8rem;padding:1.5rem;}
  .btn{padding:.85rem 1.2rem;}
  .btn-label{font-size:1.1rem;}
}
</style>
</head>
<body>

<!-- SFONDI -->
<div class="bg-slide" id="slide-0"></div>
<div class="bg-slide" id="slide-1"></div>
<div class="bg-slide" id="slide-2"></div>
<div class="bg-slide" id="slide-3"></div>
<div class="bg-slide" id="slide-4"></div>
<div class="bg-slide" id="slide-5"></div>
<div class="bg-overlay"></div>

<!-- CONTENUTO -->
<div class="content">

  <div style="text-align:center;">
    <div class="logo">br<span>Ak<span>A22</span></div>
    <div class="tagline">LIGNANO SABBIADORO</div>
  </div>

  <div class="btns">

    <a href="negozio.html" class="btn btn-shop">
      <div class="btn-icon">👗</div>
      <div class="btn-text">
        <span class="btn-label">MODA MARE ONLINE SHOP</span>
        <span class="btn-sub">Abbigliamento donna · Spedizione in tutta Italia</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>

    <a href="https://www.goldbet.it/area-personale/registrati?codAff=G5IAMA" target="_blank" class="btn btn-goldbet">
      <div class="btn-icon">🎰</div>
      <div class="btn-text">
        <span class="btn-label">GOLDBET</span>
        <span class="btn-sub">Scommesse · Casino · Bonus benvenuto esclusivo</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>

    <a href="https://airbnb.com/h/tarvisio481" target="_blank" class="btn btn-bnb">
      <div class="btn-icon">🏠</div>
      <div class="btn-text">
        <span class="btn-label">AIRBNB 1-LIGNANO PINETA</span>
        <span class="btn-sub">Airbnb</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>
<a href="https://www.airbnb.it/rooms/49201832?guests=1&adults=1&s=67&unique_share_id=19787ea2-19a2-4c6b-a7c0-9ae8ee0af177" target="_blank" class="btn btn-bnb">
      <div class="btn-icon">🏠</div>
      <div class="btn-text">
        <span class="btn-label">AIRBNB 2-LIGNANO PINETA</span>
        <span class="btn-sub">Airbnb</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>
    <a href="https://airbnb.com/h/city106" target="_blank" class="btn btn-bnb">
      <div class="btn-icon">🏠</div>
      <div class="btn-text">
        <span class="btn-label">AIRBNB 3-LIGNANO SABBIADORO</span>
        <span class="btn-sub">Airbnb</span>
      </div>
      <span class="btn-arrow">→</span>
    </a>
  </div>

</div>

<!-- DOTS -->
<div class="dots" id="dots"></div>
<div class="slide-label" id="slide-label"></div>

<script>
const slides = [
  {
    url: 'https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1600&q=80',
    label: 'MODA'
  },
  {
    url: 'https://images.unsplash.com/photo-1445205170230-053b83016050?w=1600&q=80',
    label: 'STILE'
  },
  {
    url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80',
    label: 'LIGNANO'
  },
  {
    url: 'https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=1600&q=80',
    label: 'MARE'
  },
  {
    url: 'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=1600&q=80',
    label: 'DIVERTIMENTO'
  },
  {
    url: 'https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?w=1600&q=80',
    label: 'ESTATE'
  }
];

let current = 0;
let interval;

// Preload immagini
slides.forEach((s, i) => {
  const el = document.getElementById('slide-' + i);
  el.style.backgroundImage = `url('${s.url}')`;
});

// Crea dots
const dotsEl = document.getElementById('dots');
slides.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.onclick = () => goTo(i);
  dotsEl.appendChild(d);
});

function goTo(n) {
  document.getElementById('slide-' + current).classList.remove('active');
  document.querySelectorAll('.dot')[current].classList.remove('active');
  current = n;
  document.getElementById('slide-' + current).classList.add('active');
  document.querySelectorAll('.dot')[current].classList.add('active');
  document.getElementById('slide-label').textContent = slides[current].label;
}

function next() {
  goTo((current + 1) % slides.length);
}

// Avvia
goTo(0);
interval = setInterval(next, 4000);

// Pausa su hover
document.querySelector('.content').addEventListener('mouseenter', () => clearInterval(interval));
document.querySelector('.content').addEventListener('mouseleave', () => {
  clearInterval(interval);
  interval = setInterval(next, 4000);
});

// Swipe touch
let touchX = 0;
document.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) dx < 0 ? next() : goTo((current - 1 + slides.length) % slides.length);
});
</script>
</body>
</html>
